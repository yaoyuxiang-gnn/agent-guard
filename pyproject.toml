[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-budget-guard-py"
description = "Budget caps, runaway-loop detection and circuit breakers for AI agents. Zero dependencies, framework agnostic."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = { file = "LICENSE" }
authors = [{ name = "Yuxiang Yao", email = "yaoyuxiangyyx@gmail.com" }]
keywords = [
    "ai",
    "agents",
    "llm",
    "agent",
    "openai",
    "anthropic",
    "cost",
    "budget",
    "guardrails",
    "circuit-breaker",
    "loop-detection",
    "observability",
    "token-usage",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# agent-guard has no runtime dependencies on purpose: it must be safe to drop
# into any agent stack, including ones that vendor their dependencies.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16",
    "mypy>=1.11",
]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]
langgraph = ["langgraph>=0.2"]

[project.urls]
Homepage = "https://github.com/yaoyuxiang-gnn/agent-guard"
Repository = "https://github.com/yaoyuxiang-gnn/agent-guard"
Issues = "https://github.com/yaoyuxiang-gnn/agent-guard/issues"
Changelog = "https://github.com/yaoyuxiang-gnn/agent-guard/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/yaoyuxiang-gnn/agent-guard/blob/main/ROADMAP.md"

[project.scripts]
agentguard = "agentguard.cli:main"

[tool.hatch.version]
path = "src/agentguard/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agentguard"]

# An sdist is immutable once it is on PyPI, so everything a downstream packager,
# a distro, or a reader of the source archive might reasonably want is included
# here -- the policies as much as the code.
#
# What is deliberately absent is maintainer scaffolding: the scripts that rendered
# the README's screenshot and the repository's social-preview card are not part of
# the library and do not ship. This list is exhaustive for that reason -- anything
# not named here is not published, so a new top-level directory cannot reach a
# release by default, and `tests/test_packaging.py` holds the line.
[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/docs",
    "/README.md",
    "/README.zh-CN.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/SECURITY.md",
    "/CODE_OF_CONDUCT.md",
    "/ROADMAP.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["agentguard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Ruff formats Python code blocks *inside Markdown*, which reflows the README's
# quickstart and collapses comment alignment that is there on purpose. A README
# code sample is prose with syntax highlighting; it is optimised for the person
# reading it, not for a formatter. Scope ruff to real Python sources.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    # Line length is the formatter's job, not the linter's.
    "E501",
    # `__all__` is hand-curated and ordered by purpose -- core API, errors, loop
    # detectors, accounting, reporting -- rather than alphabetically. Sorting it
    # would scatter related names and make the public surface harder to read than
    # the rule is worth. Delete this line and run `ruff check --fix .` if you
    # would rather have the sorted form; ruff applies its own ordering correctly.
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/agentguard"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["openai.*", "anthropic.*", "langchain_core.*"]
ignore_missing_imports = true
