[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-guard"
description = "Budget caps, runaway-loop detection and circuit breakers for AI agents. Zero dependencies, framework agnostic."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]
license = { file = "LICENSE" }
authors = [{ name = "Yuxiang Yao", email = "yaoyuxiangyyx@gmail.com" }]
keywords = [
    "ai",
    "agents",
    "llm",
    "agent",
    "openai",
    "anthropic",
    "cost",
    "budget",
    "guardrails",
    "circuit-breaker",
    "loop-detection",
    "observability",
    "token-usage",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

# agent-guard has no runtime dependencies on purpose: it must be safe to drop
# into any agent stack, including ones that vendor their dependencies.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.34"]

[project.urls]
Homepage = "https://github.com/yaoyuxiang-gnn/agent-guard"
Repository = "https://github.com/yaoyuxiang-gnn/agent-guard"
Issues = "https://github.com/yaoyuxiang-gnn/agent-guard/issues"
Changelog = "https://github.com/yaoyuxiang-gnn/agent-guard/blob/main/CHANGELOG.md"
Roadmap = "https://github.com/yaoyuxiang-gnn/agent-guard/blob/main/ROADMAP.md"

[project.scripts]
agent-guard = "agent_guard.cli:main"

[tool.hatch.version]
path = "src/agent_guard/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_guard"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/examples",
    "/tools",
    "/docs",
    "/README.md",
    "/README.zh-CN.md",
    "/LICENSE",
    "/CHANGELOG.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["agent_guard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/agent_guard"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["openai.*", "anthropic.*"]
ignore_missing_imports = true
