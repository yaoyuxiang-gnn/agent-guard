name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test · ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Deliberately no `pip install`. agent-guard has zero runtime and zero test
      # dependencies, so the suite must pass on a bare interpreter. If this step
      # ever needs an install, the zero-dependency promise has been broken.
      - name: Run the test suite on the standard library alone
        run: python -m unittest discover -s tests -t .

      # The test suite bootstraps `src/` onto sys.path itself (see tests/__init__.py),
      # but the examples are plain scripts that import the package normally. Without
      # an explicit PYTHONPATH they fail with ModuleNotFoundError on any machine
      # where agent-guard is not installed -- which is precisely the bare-interpreter
      # case this job exists to prove.
      #
      # Every example is listed: one that nothing runs is documentation that has
      # already drifted. `make examples` runs the same list.
      #
      # Run them all rather than stopping at the first failure -- one broken example
      # should not hide the state of the other six -- and name the culprit, because
      # "Process completed with exit code 1" tells a maintainer nothing.
      #
      # `shell: bash` is explicit on purpose: Windows runners default to PowerShell,
      # where this loop is a syntax error. Bash is present on all three images.
      - name: Run every example
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          status=0
          for example in \
            examples/basic.py \
            examples/loop_detection.py \
            examples/wrapped_client.py \
            examples/report_demo.py \
            examples/streaming.py \
            examples/langgraph_demo.py \
            examples/custom_models.py \
            examples/checkpointing.py \
            examples/scoped_budgets.py \
            examples/price_snapshot.py
          do
            echo "::group::$example"
            if python "$example"; then
              echo "ok: $example"
            else
              echo "::error title=$example failed::$example exited non-zero"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest pytest-cov

      # Proves the suite is pytest-compatible as well as unittest-compatible, and
      # keeps coverage from eroding quietly: the floor is a ratchet, not a target.
      - name: Run under pytest
        run: >-
          pytest --cov=agentguard --cov-report=term-missing --cov-report=xml
          --cov-fail-under=90

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build

      - name: Check the metadata
        run: python -m twine check dist/*

      - name: Install the wheel and smoke-test it
        run: |
          python -m pip install dist/*.whl
          cd /tmp
          python -c "import agentguard; print(agentguard.__version__)"
          agentguard --version
          agentguard pricing gpt-4o

      # Zero runtime dependencies is the promise this project is built on, so
      # enforce it rather than trusting it. Note that `requires` also reports
      # optional extras, so filter on the environment marker instead of testing
      # the list for emptiness -- extras are a feature, runtime deps are not.
      - name: Assert the wheel declares no runtime dependencies
        run: |
          python - <<'PY'
          import importlib.metadata as md
          import pathlib
          import sys
          import tomllib

          # Read the distribution name instead of hardcoding it: it is
          # deliberately not the same string as the import name.
          name = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          )["project"]["name"]
          declared = md.requires(name) or []
          runtime = [req for req in declared if "extra ==" not in req]
          if runtime:
              sys.exit(f"runtime dependencies crept into the wheel: {runtime}")
          print(f"{name}: zero runtime dependencies; {len(declared)} optional extras")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
