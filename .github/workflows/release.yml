name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, pathlib, re, sys
          version = re.search(
              r'__version__\s*=\s*"([^"]+)"',
              pathlib.Path("src/agent_guard/_version.py").read_text(encoding="utf-8"),
          ).group(1)
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if version != tag:
              sys.exit(f"tag {tag!r} does not match _version.py {version!r}")
          print(f"version {version} matches the tag")
          PY

      - name: Run the test suite
        run: python -m unittest discover -s tests -t .

      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Trusted publishing: configure this repository as a publisher on PyPI, then
    # no API token ever has to live in repository secrets.
    environment:
      name: pypi
      url: https://pypi.org/p/agent-guard
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract the changelog section for this tag
        run: |
          python - <<'PY'
          import os, pathlib, re
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"^##\s*\[?{re.escape(tag)}\]?.*?$(.*?)(?=^##\s|\Z)"
          match = re.search(pattern, text, re.MULTILINE | re.DOTALL)
          body = match.group(1).strip() if match else "See CHANGELOG.md."
          pathlib.Path("release-notes.md").write_text(body, encoding="utf-8")
          PY

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: dist/*
          generate_release_notes: false
