<tspan fill="#3fb950">$0.05</tspan>
<tspan fill="#c9d1d9"> budget.</tspan>
</text>
<text xml:space="preserve" x="18" y="67" opacity="0"><animate attributeName="opacity" dur="10.94s" repeatCount="indefinite" calcMode="discrete" values="0;1;1" keyTimes="0;0.0256;1"/>
<tspan fill="#6e7681"></tspan>
</text>
