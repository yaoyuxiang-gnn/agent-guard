<svg xmlns="http://www.w3.org/2000/svg" width="591" height="503" viewBox="0 0 591 503" role="img" aria-label="agentguard stopping an agent that exceeded its budget">
<title>agentguard stopping an agent that exceeded its budget</title>
<style>
  text { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; font-size: 13px; white-space: pre; }
  .bar { fill: #161b22; }
  .body { fill: #0d1117; }
  @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
